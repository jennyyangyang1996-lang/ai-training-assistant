<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>AI 企业培训助手</title>
  </head>
  <body>
    <h1>AI 企业培训助手</h1>

    <p>请输入你的问题：</p>

    <input
      type="text"
      id="question"
      placeholder="例如：请假流程是什么？"
      style="width: 300px"
    />

    <button onclick="sendQuestion()">发送</button>

    <hr />

    <h3>AI 回答：</h3>

    <div id="answer">（这里以后会显示 AI 的回答）</div>
    <script>
      async function sendQuestion() {
        const question = document.getElementById("question").value;

        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            question: question,
          }),
        });

        const result = await response.json();

        document.getElementById("answer").innerText = result.answer;
      }
    </script>
  </body>
</html>
